name: Build Windows Executable

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# FIX: This forces GitHub to use the newer Node.js 24 engine,
# which silences the deprecation warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # This will now run on Node 24 because of the 'env' above

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r config/requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          python build_exe.py --onedir

      - name: Display output
        run: |
          Get-ChildItem dist/ -Recurse -File | Select-Object FullName, @{Name="SizeMB";Expression={[math]::Round($_.Length/1MB,2)}}
          $size = [math]::Round((Get-ChildItem dist/ -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1MB, 2)
          Write-Host "Total build size: $size MB"

      - name: Create zip for release
        run: |
          Compress-Archive -Path "dist/TerrainGenerator/*" -DestinationPath "dist/TerrainGenerator-Windows.zip" -Force

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          files: dist/TerrainGenerator-Windows.zip
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TerrainGenerator-Windows
          path: |
            dist/TerrainGenerator/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install ruff
        run: pip install ruff
        
      - name: Run linting
        run: |
          ruff check src/ tools/*.py || true
