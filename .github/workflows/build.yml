name: Build Windows Executable

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r config/requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller terrain_generator.spec --clean

      - name: Display output
        run: |
          Get-ChildItem dist/ -Recurse -File | Select-Object FullName, @{Name="SizeMB";Expression={[math]::Round($_.Length/1MB,2)}}
          $size = [math]::Round((Get-ChildItem dist/ -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1MB, 2)
          Write-Host "Total build size: $size MB"

      - name: Create zip for release
        run: |
          Compress-Archive -Path "dist/TerrainGenerator/*" -DestinationPath "dist/TerrainGenerator-Windows.zip" -Force

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TerrainGenerator-Windows.zip
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TerrainGenerator-Windows
          path: |
            dist/TerrainGenerator/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install ruff
        run: pip install ruff
        
      - name: Run linting
        run: |
          ruff check src/ tools/*.py || true
